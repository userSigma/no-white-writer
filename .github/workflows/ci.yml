# CI 质量门禁：push 到 main/develop 或提交 PR 时运行。
# 三道检查与本机门禁一致：格式 0 变化、analyze 无问题、全部测试通过；
# 另在 Windows runner 上验证 release 构建不被破坏。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 与本机开发环境一致：Flutter 3.47.7 stable / Dart 3.13.5。
  # 升级 SDK 时在本地验证通过后再改这里。
  FLUTTER_VERSION: 3.47.7

jobs:
  quality:
    name: 格式 / 静态分析 / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖安装（按 pubspec.lock）
        run: flutter pub get

      - name: 格式检查（不允许任何文件被自动改动）
        run: dart format --output=none --set-exit-if-changed .

      - name: 静态分析
        run: flutter analyze

      - name: 测试
        run: flutter test

  windows-build:
    name: Windows x64 release 构建验证
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖安装（按 pubspec.lock）
        run: flutter pub get

      - name: 构建 Windows x64 release
        run: flutter build windows --release

      # 产物仅用于排查构建问题，不是正式发布包（正式包走 release.yml）。
      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: windows-x64-release-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          retention-days: 7
