    <clipPath id="bu-edge"><use xlink:href="#bu-shape"/></clipPath>
    <clipPath id="bai-edge"><use xlink:href="#bai-shape"/></clipPath>
  </defs>
  <g id="logo" clip-path="url(#outer-edge)">
    <g id="rounded-frame">
      <rect width="840" height="855" rx="170" ry="176" fill="url(#frame-rim)"/>
      <rect x="3" y="5" width="834" height="845" rx="166" ry="170" fill="url(#frame-face)"/>
    </g>
    <g id="white-paper" clip-path="url(#paper-edge)">
      <rect x="23" y="24" width="794" height="808" rx="147" ry="152" fill="url(#paper)"/>
      <rect x="23" y="24" width="794" height="808" filter="url(#matte-grain)" opacity=".027"/>
      <rect x="23" y="24" width="794" height="808" rx="147" ry="152" fill="none" stroke="#111" stroke-width="13" opacity=".43" filter="url(#paper-shadow)"/>
      <rect x="23" y="24" width="794" height="808" rx="147" ry="152" fill="none" stroke="#141414" stroke-width="2" opacity=".37"/>
    </g>
    <g id="bu" aria-label="不">
      <use xlink:href="#bu-shape" fill="#171717" opacity=".33" transform="translate(1 -2)" filter="url(#ink-shadow)"/>
      <use xlink:href="#bu-shape" fill="#101010"/>
      <g clip-path="url(#bu-edge)">
        <use xlink:href="#bu-shape" fill="url(#bu-face)" transform="translate(0 -2.2)"/>
      </g>
    </g>
    <g id="black-disc">
      <ellipse cx="420" cy="597" rx="201.5" ry="205" fill="#121212" opacity=".35" filter="url(#ink-shadow)" transform="translate(1 -1)"/>
      <ellipse cx="420" cy="597" rx="201.5" ry="205" fill="url(#disc-rim)"/>
      <ellipse cx="420" cy="597.7" rx="198.8" ry="202.6" fill="url(#disc-face)"/>
    </g>
    <g id="bai" aria-label="白">
      <use xlink:href="#bai-shape" fill="#080808" transform="translate(-2 3)" filter="url(#raised-shadow)"/>
      <use xlink:href="#bai-shape" fill="#d2d2d2"/>
      <g clip-path="url(#bai-edge)">
        <use xlink:href="#bai-shape" fill="url(#bai-face)" transform="translate(0 -1.5)"/>
      </g>
    </g>
  </g>
</svg>
