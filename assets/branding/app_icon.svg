<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="855" viewBox="0 0 840 855" role="img" aria-labelledby="logo-title">
  <title id="logo-title">不白 LOGO</title>
  <defs>
    <linearGradient id="frame-rim" x1="0" y1="0" x2=".7" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#4b4b4b"/>
      <stop offset=".18" stop-color="#333"/>
      <stop offset=".73" stop-color="#292929"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="frame-face" x1=".15" y1="0" x2=".83" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#191919"/>
      <stop offset=".2" stop-color="#101010"/>
      <stop offset=".64" stop-color="#141414"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="paper" x1=".2" y1="0" x2=".83" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fcfcfc"/>
      <stop offset=".53" stop-color="#fff"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="bu-face" x1=".14" y1="0" x2=".92" y2=".75" gradientUnits="objectBoundingBox">
      <stop stop-color="#3c3c3c"/>
      <stop offset=".35" stop-color="#181818"/>
      <stop offset=".82" stop-color="#272727"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="disc-rim" x1=".2" y1="0" x2=".65" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#5b5b5b"/>
      <stop offset=".30" stop-color="#292929"/>
      <stop offset=".79" stop-color="#303030"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <radialGradient id="disc-face" cx=".46" cy=".50" r=".54">
      <stop stop-color="#222"/>
      <stop offset=".8" stop-color="#1d1d1d"/>
      <stop offset=".96" stop-color="#171717"/>
      <stop offset="1" stop-color="#111"/>
    </radialGradient>
    <linearGradient id="bai-face" x1="0" y1=".2" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff"/>
      <stop offset=".73" stop-color="#f9f9f9"/>
      <stop offset="1" stop-color="#e3e3e3"/>
    </linearGradient>
    <clipPath id="outer-edge">
      <rect width="840" height="855" rx="170" ry="176"/>
    </clipPath>
    <clipPath id="paper-edge">
      <rect x="23" y="24" width="794" height="808" rx="147" ry="152"/>
    </clipPath>
    <filter id="paper-shadow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ink-shadow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="raised-shadow" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.1"/>
    </filter>
    <filter id="matte-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".45" numOctaves="2" seed="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
